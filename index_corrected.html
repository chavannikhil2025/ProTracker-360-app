<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTracker 360</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS Library for Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* Custom Scrollbar Styles */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Date input placeholder fix for iOS */
        input[type="date"] {
            min-height: 2.5rem;
        }
        
        /* Sync indicator animation */
        @keyframes pulse-sync {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .syncing {
            animation: pulse-sync 1.5s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <!-- Application Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Upload, Plus, Edit, X, Search, Download, 
          LayoutDashboard, DollarSign, Calendar, FileSpreadsheet, 
          ChevronLeft, ChevronRight, Layers, CheckCircle,
          ArrowUpDown, ArrowUp, ArrowDown, Wallet, ClipboardList,
          Wifi, WifiOff, Cloud, CloudOff, Filter
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- Configuration & Types ---

        const COLUMN_DEFS = {
          'Sr No': 'general',
          'Client': 'general',
          'Location': 'general',
          'Callout': 'date',
          'Status': 'general',
          'State': 'general',
          'Address': 'general',
          'Contact Person': 'general',
          'Contact No.': 'general',
          'Sign Type': 'general',
          'Survey By': 'general',
          'Survey Date': 'date',
          'Survey Shared': 'general', 
          'Signage Size': 'general',
          'Artwork Sent': 'date',
          'Artwork Approval': 'date',
          'Cost Shared': 'date',
          'Cost Approval': 'date',
          'PI No.': 'general',
          'PI Date': 'date',
          'PO Received': 'date',
          'PO Number': 'general',
          'JC No': 'general',
          'JC Date': 'date',
          'Production Start': 'date',
          'Production Finish': 'date',
          'Dispatch Date': 'date',
          'At Site': 'date',
          'Work Start': 'date',
          'Work Complete': 'date',
          'Contractor': 'general',
          'Completion Certificate': 'general',
          'Photo': 'general',
          'Warranty': 'general',
          'Invoice No': 'general',
          'Invoice Date': 'date',
          'Invoice Amt': 'number',
          'Invoice Submitted': 'date',
          'Payment Terms': 'general',
          'Due Date': 'date',
          'Payment received': 'number',
          'Payment Balance': 'number',
          'AWB NO': 'general',
          'Aging': 'number',
          'Remarks': 'general'
        };

        // CORRECTED FIELD GROUPS - State kept in Client Info, Survey By & Artwork Sent moved to Survey & Design
        // PO Received moved to Approvals & PO, Invoice Submitted moved to Finance
        const FIELD_GROUPS_TEMPLATE = {
          'Client Info': ['Sr No', 'Client', 'Location', 'Callout', 'Status', 'State', 'Address', 'Contact Person', 'Contact No.'],
          'Survey & Design': ['Sign Type', 'Survey By', 'Survey Date', 'Survey Shared', 'Signage Size', 'Artwork Sent', 'Artwork Approval'],
          'Approvals & PO': ['Cost Shared', 'Cost Approval', 'PI No.', 'PI Date', 'PO Received', 'PO Number'],
          'Production & Site': ['JC No', 'JC Date', 'Production Start', 'Production Finish', 'Dispatch Date', 'At Site', 'Work Start', 'Work Complete', 'Contractor', 'Completion Certificate', 'Photo', 'Warranty', 'AWB NO'],
          'Finance': ['Invoice No', 'Invoice Date', 'Invoice Amt', 'Invoice Submitted', 'Payment Terms', 'Due Date', 'Payment received', 'Payment Balance', 'Aging', 'Remarks']
        };

        const KNOWN_COLUMNS = Object.keys(COLUMN_DEFS);

        const STATUS_OPTIONS = [
          "Payment Awaited",
          "Invoice to be done",
          "WIP",
          "Material at Site",
          "Material at Site-Hold",
          "In Transit",
          "Under Production",
          "PO Awaited",
          "Cost Approval awaited",
          "Artwork Approval Awaited",
          "Survey to be done",
          "Photo Awaited",
          "Paid"
        ];

        // --- Helper Functions ---

        const toTitleCase = (str) => {
          if (!str || typeof str !== 'string') return str;
          if (STATUS_OPTIONS.includes(str)) return str;
          return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        };

        const getColumnType = (colName) => {
          if (!colName) return 'general';
          const cleanName = colName.trim();
          if (COLUMN_DEFS[cleanName]) return COLUMN_DEFS[cleanName];
          const match = Object.keys(COLUMN_DEFS).find(k => k.toLowerCase() === cleanName.toLowerCase());
          return match ? COLUMN_DEFS[match] : 'general';
        };

        const parseExcelDate = (value) => {
          if (!value) return '';
          if (typeof value === 'number' && value > 20000) {
            const date = new Date(Math.round((value - 25569) * 86400 * 1000));
            return date.toISOString().split('T')[0];
          }
          if (typeof value === 'string') {
            if (value.includes('/')) {
              const parts = value.split('/');
              if (parts.length === 3) {
                let year = parts[2];
                if (year.length === 2) year = '20' + year;
                return `${year}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
              }
            }
            const date = new Date(value);
            if (!isNaN(date.getTime())) return date.toISOString().split('T')[0];
          }
          return value;
        };

        const formatDisplayDate = (isoString) => {
          if (!isoString) return '-';
          try {
            const date = new Date(isoString);
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          } catch {
            return isoString;
          }
        };

        const formatNumber = (value) => {
          if (value === null || value === undefined || value === '') return '-';
          return new Intl.NumberFormat('en-IN').format(value);
        };

        const parseCSV = (text) => {
          const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
          if (lines.length === 0) return { headers: [], rows: [] };
          const headers = lines[0].split(',').map(h => h.trim());
          const rows = lines.slice(1).map(line => {
            const values = line.split(',');
            const obj = {};
            headers.forEach((h, i) => {
              obj[h] = values[i]?.trim() || '';
            });
            return obj;
          });
          return { headers, rows };
        };

        const readExcelFile = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '', raw: false });
                
                if (jsonData.length === 0) {
                  reject(new Error('Excel file is empty'));
                  return;
                }

                const headers = Object.keys(jsonData[0]);
                const rows = jsonData.map(row => {
                  const cleanRow = {};
                  headers.forEach(h => {
                    const type = getColumnType(h);
                    if (type === 'date') {
                      cleanRow[h] = parseExcelDate(row[h]);
                    } else if (type === 'number') {
                      cleanRow[h] = row[h] ? parseFloat(row[h]) : 0;
                    } else {
                      cleanRow[h] = toTitleCase(row[h]);
                    }
                  });
                  return cleanRow;
                });

                resolve({ headers, rows });
              } catch (err) {
                reject(err);
              }
            };
            reader.onerror = () => reject(new Error('File reading failed'));
            reader.readAsArrayBuffer(file);
          });
        };

        const exportToExcel = (data, filename = 'export.xlsx') => {
          const ws = XLSX.utils.json_to_sheet(data);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Data');
          XLSX.writeFile(wb, filename);
        };

        // --- Local Storage Manager ---
        const STORAGE_KEY = 'protracker360_data';
        const LAST_SYNC_KEY = 'protracker360_last_sync';

        const saveToLocalStorage = (data) => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString());
            return true;
          } catch (error) {
            console.error('Failed to save to localStorage:', error);
            return false;
          }
        };

        const loadFromLocalStorage = () => {
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : null;
          } catch (error) {
            console.error('Failed to load from localStorage:', error);
            return null;
          }
        };

        const getLastSyncTime = () => {
          try {
            const lastSync = localStorage.getItem(LAST_SYNC_KEY);
            return lastSync ? new Date(lastSync) : null;
          } catch (error) {
            return null;
          }
        };

        // --- Components ---

        const StatusBadge = ({ status }) => {
          const colors = {
            'Paid': 'bg-green-100 text-green-700 border-green-200',
            'Payment Awaited': 'bg-amber-100 text-amber-700 border-amber-200',
            'Invoice to be done': 'bg-orange-100 text-orange-700 border-orange-200',
            'WIP': 'bg-blue-100 text-blue-700 border-blue-200',
            'Material at Site': 'bg-purple-100 text-purple-700 border-purple-200',
            'Material at Site-Hold': 'bg-red-100 text-red-700 border-red-200',
            'In Transit': 'bg-cyan-100 text-cyan-700 border-cyan-200',
            'Under Production': 'bg-indigo-100 text-indigo-700 border-indigo-200',
            'PO Awaited': 'bg-pink-100 text-pink-700 border-pink-200',
            'Cost Approval awaited': 'bg-yellow-100 text-yellow-700 border-yellow-200',
            'Artwork Approval Awaited': 'bg-lime-100 text-lime-700 border-lime-200',
            'Survey to be done': 'bg-teal-100 text-teal-700 border-teal-200',
            'Photo Awaited': 'bg-rose-100 text-rose-700 border-rose-200'
          };
          return (
            <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${colors[status] || 'bg-slate-100 text-slate-700 border-slate-200'}`}>
              {status || '-'}
            </span>
          );
        };

        function ExcelTrackerManager() {
          const [rawData, setRawData] = useState([]);
          const [activeView, setActiveView] = useState('dashboard');
          const [searchTerm, setSearchTerm] = useState('');
          const [isEditing, setIsEditing] = useState(false);
          const [formData, setFormData] = useState({});
          const [currentId, setCurrentId] = useState(null);
          const [activeTab, setActiveTab] = useState('Client Info');
          const [currentPage, setCurrentPage] = useState(1);
          const [sortConfig, setSortConfig] = useState({ key: null, direction: null });
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          const [isSyncing, setIsSyncing] = useState(false);
          const [lastSyncTime, setLastSyncTime] = useState(null);
          const [selectedClient, setSelectedClient] = useState('');

          const rowsPerPage = 25;

          // Online/Offline detection
          useEffect(() => {
            const handleOnline = () => {
              setIsOnline(true);
              console.log('Connection restored - online mode');
            };
            const handleOffline = () => {
              setIsOnline(false);
              console.log('Connection lost - offline mode');
            };

            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);

            return () => {
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
            };
          }, []);

          // Load data from localStorage on mount
          useEffect(() => {
            const storedData = loadFromLocalStorage();
            if (storedData && storedData.length > 0) {
              setRawData(storedData);
              setLastSyncTime(getLastSyncTime());
              console.log('Loaded data from localStorage:', storedData.length, 'records');
            }
          }, []);

          // Auto-save to localStorage whenever data changes
          useEffect(() => {
            if (rawData.length > 0) {
              const saved = saveToLocalStorage(rawData);
              if (saved) {
                setLastSyncTime(getLastSyncTime());
                console.log('Auto-saved to localStorage');
              }
            }
          }, [rawData]);

          const availableColumns = useMemo(() => {
            if (rawData.length === 0) return KNOWN_COLUMNS;
            const cols = new Set();
            rawData.forEach(row => Object.keys(row).forEach(k => cols.add(k)));
            return [...cols].filter(c => c !== '_id');
          }, [rawData]);

          const dynamicFieldGroups = useMemo(() => {
            const groups = {};
            Object.entries(FIELD_GROUPS_TEMPLATE).forEach(([groupName, fields]) => {
              groups[groupName] = fields.filter(f => availableColumns.includes(f));
            });
            const orphans = availableColumns.filter(col => 
              !Object.values(FIELD_GROUPS_TEMPLATE).flat().includes(col)
            );
            if (orphans.length > 0) {
              groups['Other Details'] = orphans;
            }
            return groups;
          }, [availableColumns]);

          const tableColumns = useMemo(() => {
            const baseColumns = ['Client', 'Location', 'Status', 'State'];
            const additionalColumns = availableColumns.filter(c => !baseColumns.includes(c));
            return [...baseColumns, ...additionalColumns];
          }, [availableColumns]);

          // Get unique client list for filter
          const clientList = useMemo(() => {
            const clients = new Set();
            rawData.forEach(row => {
              if (row['Client']) clients.add(row['Client']);
            });
            return ['All Clients', ...Array.from(clients).sort()];
          }, [rawData]);

          const filteredData = useMemo(() => {
            let filtered = rawData;
            
            // Filter by client
            if (selectedClient && selectedClient !== 'All Clients') {
              filtered = filtered.filter(row => row['Client'] === selectedClient);
            }
            
            // Filter by search term
            if (searchTerm.trim()) {
              const lower = searchTerm.toLowerCase();
              filtered = filtered.filter(row =>
                Object.values(row).some(val =>
                  String(val).toLowerCase().includes(lower)
                )
              );
            }
            
            return filtered;
          }, [rawData, searchTerm, selectedClient]);

          const sortedData = useMemo(() => {
            if (!sortConfig.key) return filteredData;
            
            const sorted = [...filteredData].sort((a, b) => {
              const aVal = a[sortConfig.key];
              const bVal = b[sortConfig.key];
              
              if (aVal === bVal) return 0;
              if (!aVal) return 1;
              if (!bVal) return -1;
              
              const type = getColumnType(sortConfig.key);
              if (type === 'number') {
                return parseFloat(aVal) - parseFloat(bVal);
              }
              if (type === 'date') {
                return new Date(aVal) - new Date(bVal);
              }
              return String(aVal).localeCompare(String(bVal));
            });
            
            return sortConfig.direction === 'desc' ? sorted.reverse() : sorted;
          }, [filteredData, sortConfig]);

          const paginatedData = useMemo(() => {
            const start = (currentPage - 1) * rowsPerPage;
            return sortedData.slice(start, start + rowsPerPage);
          }, [sortedData, currentPage]);

          const pageCount = Math.ceil(sortedData.length / rowsPerPage);

          const dashboardMetrics = useMemo(() => {
            const totalProjects = filteredData.length;
            const totalInvoiceAmt = filteredData.reduce((sum, row) => sum + (parseFloat(row['Invoice Amt']) || 0), 0);
            const totalPaymentReceived = filteredData.reduce((sum, row) => sum + (parseFloat(row['Payment received']) || 0), 0);
            const totalBalance = filteredData.reduce((sum, row) => sum + (parseFloat(row['Payment Balance']) || 0), 0);
            
            const statusCounts = {};
            filteredData.forEach(row => {
              const status = row['Status'] || 'Unknown';
              statusCounts[status] = (statusCounts[status] || 0) + 1;
            });

            return {
              totalProjects,
              totalInvoiceAmt,
              totalPaymentReceived,
              totalBalance,
              statusCounts
            };
          }, [filteredData]);

          const handleSort = (column) => {
            setSortConfig(prev => {
              if (prev.key === column) {
                if (prev.direction === 'asc') return { key: column, direction: 'desc' };
                if (prev.direction === 'desc') return { key: null, direction: null };
              }
              return { key: column, direction: 'asc' };
            });
          };

          const handleFileUpload = async (event) => {
            const file = event.target.files?.[0];
            if (!file) return;

            try {
              let parsedData;
              if (file.name.endsWith('.csv')) {
                const text = await file.text();
                const { headers, rows } = parseCSV(text);
                parsedData = { headers, rows };
              } else {
                parsedData = await readExcelFile(file);
              }

              const dataWithIds = parsedData.rows.map((row, idx) => ({
                _id: `${Date.now()}_${idx}`,
                ...row
              }));

              setRawData(dataWithIds);
              setActiveView('data');
              setCurrentPage(1);
              setSortConfig({ key: null, direction: null });
              setSearchTerm('');
              setSelectedClient('');
              alert(`Imported ${dataWithIds.length} records successfully!`);
            } catch (error) {
              alert('Error reading file: ' + error.message);
            }
          };

          const handleInputChange = (field, value) => {
            setFormData(prev => {
              const updated = { ...prev, [field]: value };
              
              if (field === 'Invoice Amt' || field === 'Payment received') {
                const invoiceAmt = parseFloat(updated['Invoice Amt']) || 0;
                const paymentReceived = parseFloat(updated['Payment received']) || 0;
                updated['Payment Balance'] = invoiceAmt - paymentReceived;
              }
              
              if (field === 'Due Date' || field === 'Payment received') {
                const dueDate = updated['Due Date'];
                const paymentReceived = parseFloat(updated['Payment received']) || 0;
                const invoiceAmt = parseFloat(updated['Invoice Amt']) || 0;
                
                if (dueDate && paymentReceived < invoiceAmt) {
                  const due = new Date(dueDate);
                  const today = new Date();
                  const diffTime = today - due;
                  const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                  updated['Aging'] = diffDays > 0 ? diffDays : 0;
                } else {
                  updated['Aging'] = 0;
                }
              }
              
              return updated;
            });
          };

          const initiateEdit = (row) => {
            setCurrentId(row._id);
            setFormData({ ...row });
            setIsEditing(true);
            setActiveTab('Client Info');
          };

          const initiateCreate = () => {
            const newEntry = {};
            availableColumns.forEach(col => {
              newEntry[col] = '';
            });
            setFormData(newEntry);
            setCurrentId(null);
            setIsEditing(true);
            setActiveTab('Client Info');
          };

          const handleSave = () => {
            if (currentId) {
              setRawData(prev => prev.map(item => item._id === currentId ? { ...formData, _id: currentId } : item));
            } else {
              const newId = `${Date.now()}_${Math.random()}`;
              setRawData(prev => [...prev, { ...formData, _id: newId }]);
            }
            closeForm();
          };

          const closeForm = () => {
            setIsEditing(false);
            setFormData({});
            setCurrentId(null);
          };

          const handleExport = () => {
            const exportData = rawData.map(({ _id, ...rest }) => rest);
            exportToExcel(exportData, `ProTracker_Export_${new Date().toISOString().split('T')[0]}.xlsx`);
          };

          const syncIndicator = () => {
            if (isSyncing) {
              return (
                <div className="flex items-center gap-2 text-blue-600">
                  <Cloud className="h-4 w-4 syncing" />
                  <span className="text-xs font-medium">Syncing...</span>
                </div>
              );
            }
            
            if (!isOnline) {
              return (
                <div className="flex items-center gap-2 text-amber-600">
                  <CloudOff className="h-4 w-4" />
                  <span className="text-xs font-medium">Offline Mode</span>
                </div>
              );
            }
            
            if (lastSyncTime) {
              return (
                <div className="flex items-center gap-2 text-green-600">
                  <Cloud className="h-4 w-4" />
                  <span className="text-xs">Saved {new Date(lastSyncTime).toLocaleTimeString()}</span>
                </div>
              );
            }
            
            return (
              <div className="flex items-center gap-2 text-slate-400">
                <Cloud className="h-4 w-4" />
                <span className="text-xs">Ready</span>
              </div>
            );
          };

          return (
            <div className="min-h-screen flex flex-col">
              <header className="bg-gradient-to-r from-blue-700 to-blue-900 text-white shadow-xl sticky top-0 z-40">
                <div className="max-w-7xl mx-auto px-6 py-4">
                  <div className="flex items-center justify-between">
                    <div className="flex items-center gap-3">
                      <Layers className="h-8 w-8" />
                      <div>
                        <h1 className="text-2xl font-bold tracking-tight">ProTracker 360</h1>
                        <p className="text-blue-100 text-sm">Project Management System</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-4">
                      {syncIndicator()}
                      <label className="cursor-pointer bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg transition flex items-center gap-2 border border-white/20">
                        <Upload className="h-4 w-4" />
                        <span className="text-sm font-medium">Import Data</span>
                        <input type="file" accept=".xlsx,.xls,.csv" onChange={handleFileUpload} className="hidden" />
                      </label>
                    </div>
                  </div>
                </div>
              </header>

              <nav className="bg-white border-b border-slate-200 sticky top-[72px] z-30 shadow-sm">
                <div className="max-w-7xl mx-auto px-6">
                  <div className="flex gap-1">
                    <button
                      onClick={() => setActiveView('dashboard')}
                      className={`px-5 py-3 font-medium text-sm transition border-b-2 ${
                        activeView === 'dashboard' 
                          ? 'border-blue-600 text-blue-600 bg-blue-50' 
                          : 'border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <LayoutDashboard className="h-4 w-4" />
                        Dashboard
                      </div>
                    </button>
                    <button
                      onClick={() => setActiveView('data')}
                      className={`px-5 py-3 font-medium text-sm transition border-b-2 ${
                        activeView === 'data' 
                          ? 'border-blue-600 text-blue-600 bg-blue-50' 
                          : 'border-transparent text-slate-600 hover:text-slate-900 hover:bg-slate-50'
                      }`}
                    >
                      <div className="flex items-center gap-2">
                        <FileSpreadsheet className="h-4 w-4" />
                        Data View
                      </div>
                    </button>
                  </div>
                </div>
              </nav>

              <main className="flex-1 max-w-7xl mx-auto w-full px-6 py-6">
                {activeView === 'dashboard' ? (
                  <div className="space-y-6">
                    <div className="flex items-center justify-between">
                      <h2 className="text-2xl font-bold text-slate-800">Overview Dashboard</h2>
                      {rawData.length > 0 && (
                        <div className="flex items-center gap-3">
                          <div className="flex items-center gap-2 bg-white px-4 py-2 rounded-lg border border-slate-200">
                            <Filter className="h-4 w-4 text-slate-400" />
                            <select
                              value={selectedClient}
                              onChange={(e) => {
                                setSelectedClient(e.target.value);
                                setCurrentPage(1);
                              }}
                              className="text-sm font-medium text-slate-700 focus:outline-none bg-transparent"
                            >
                              {clientList.map(client => (
                                <option key={client} value={client}>{client}</option>
                              ))}
                            </select>
                          </div>
                        </div>
                      )}
                    </div>

                    {rawData.length > 0 ? (
                      <>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                          <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between mb-4">
                              <Layers className="h-8 w-8 opacity-80" />
                              <span className="text-3xl font-bold">{dashboardMetrics.totalProjects}</span>
                            </div>
                            <p className="text-blue-100 text-sm font-medium">Total Projects</p>
                          </div>

                          <div className="bg-gradient-to-br from-green-500 to-green-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between mb-4">
                              <DollarSign className="h-8 w-8 opacity-80" />
                              <span className="text-2xl font-bold">₹{formatNumber(dashboardMetrics.totalInvoiceAmt)}</span>
                            </div>
                            <p className="text-green-100 text-sm font-medium">Total Invoice Amount</p>
                          </div>

                          <div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between mb-4">
                              <Wallet className="h-8 w-8 opacity-80" />
                              <span className="text-2xl font-bold">₹{formatNumber(dashboardMetrics.totalPaymentReceived)}</span>
                            </div>
                            <p className="text-purple-100 text-sm font-medium">Payment Received</p>
                          </div>

                          <div className="bg-gradient-to-br from-amber-500 to-amber-600 rounded-2xl shadow-lg p-6 text-white">
                            <div className="flex items-center justify-between mb-4">
                              <ClipboardList className="h-8 w-8 opacity-80" />
                              <span className="text-2xl font-bold">₹{formatNumber(dashboardMetrics.totalBalance)}</span>
                            </div>
                            <p className="text-amber-100 text-sm font-medium">Outstanding Balance</p>
                          </div>
                        </div>

                        <div className="bg-white rounded-2xl shadow-lg p-6 border border-slate-200">
                          <h3 className="text-lg font-bold text-slate-800 mb-4">Project Status Distribution</h3>
                          <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                            {Object.entries(dashboardMetrics.statusCounts).map(([status, count]) => (
                              <div key={status} className="flex items-center justify-between p-3 bg-slate-50 rounded-lg border border-slate-200">
                                <StatusBadge status={status} />
                                <span className="font-bold text-slate-700 text-lg">{count}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="flex flex-col items-center justify-center py-24 text-slate-400">
                        <LayoutDashboard className="h-20 w-20 mb-4 opacity-50" />
                        <p className="text-xl font-medium text-slate-600 mb-2">No Data Available</p>
                        <p className="text-sm">Import your Excel file to view dashboard metrics</p>
                      </div>
                    )}
                  </div>
                ) : (
                  <div className="bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
                    {rawData.length > 0 && (
                      <div className="p-6 border-b border-slate-200 bg-slate-50">
                        <div className="flex items-center justify-between gap-4 flex-wrap">
                          <div className="flex items-center gap-3 flex-1 min-w-[300px]">
                            <div className="relative flex-1">
                              <Search className="absolute left-3 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400" />
                              <input
                                type="text"
                                placeholder="Search across all fields..."
                                value={searchTerm}
                                onChange={(e) => {
                                  setSearchTerm(e.target.value);
                                  setCurrentPage(1);
                                }}
                                className="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm"
                              />
                            </div>
                            <div className="flex items-center gap-2 bg-white px-4 py-2.5 rounded-lg border border-slate-300">
                              <Filter className="h-4 w-4 text-slate-400" />
                              <select
                                value={selectedClient}
                                onChange={(e) => {
                                  setSelectedClient(e.target.value);
                                  setCurrentPage(1);
                                }}
                                className="text-sm font-medium text-slate-700 focus:outline-none bg-transparent"
                              >
                                {clientList.map(client => (
                                  <option key={client} value={client}>{client}</option>
                                ))}
                              </select>
                            </div>
                          </div>
                          <div className="flex gap-2">
                            <button
                              onClick={initiateCreate}
                              className="px-4 py-2.5 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg shadow-lg shadow-blue-600/20 transition text-sm flex items-center gap-2"
                            >
                              <Plus className="h-4 w-4" />
                              Add New
                            </button>
                            <button
                              onClick={handleExport}
                              className="px-4 py-2.5 bg-green-600 text-white font-medium hover:bg-green-700 rounded-lg shadow-lg shadow-green-600/20 transition text-sm flex items-center gap-2"
                            >
                              <Download className="h-4 w-4" />
                              Export
                            </button>
                          </div>
                        </div>
                      </div>
                    )}

                    {rawData.length > 0 ? (
                      <>
                        <div className="overflow-x-auto custom-scrollbar">
                          <table className="w-full">
                            <thead className="bg-slate-100 border-b border-slate-200 sticky top-0 z-20">
                              <tr>
                                {tableColumns.map((col, index) => (
                                  <th 
                                    key={col} 
                                    className={`px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase tracking-wider whitespace-nowrap ${
                                      index === 0 ? 'sticky left-0 bg-slate-100 z-10 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]' : ''
                                    }`}
                                  >
                                    <div 
                                      className="flex items-center gap-2 cursor-pointer select-none hover:text-slate-900"
                                      onClick={() => handleSort(col)}
                                    >
                                      <span>{col}</span>
                                      {sortConfig.key === col ? (
                                        sortConfig.direction === 'asc' ? <ArrowUp className="h-3 w-3" /> : <ArrowDown className="h-3 w-3" />
                                      ) : (
                                        <ArrowUpDown className="h-3 w-3 text-slate-300" />
                                      )}
                                    </div>
                                  </th>
                                ))}
                                <th className="px-4 py-3 font-medium sticky right-0 bg-slate-50 z-10 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.1)] text-center">Actions</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {paginatedData.map((row) => (
                                <tr key={row._id} className="hover:bg-blue-50/50 transition-colors group">
                                  {tableColumns.map((col, index) => {
                                    const type = getColumnType(col);
                                    return (
                                      <td 
                                        key={col} 
                                        className={`px-4 py-3 text-slate-600 whitespace-nowrap ${index === 0 ? 'sticky left-0 bg-white group-hover:bg-blue-50/50 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] font-medium text-slate-900' : ''}`}
                                      >
                                        {col === 'Status' ? <StatusBadge status={row[col]} /> :
                                         type === 'date' ? formatDisplayDate(row[col]) :
                                         type === 'number' ? formatNumber(row[col]) :
                                         row[col]
                                        }
                                      </td>
                                    );
                                  })}
                                  <td className="px-4 py-3 sticky right-0 bg-white group-hover:bg-blue-50/50 shadow-[-2px_0_5px_-2px_rgba(0,0,0,0.05)] text-center">
                                    <button
                                      onClick={() => initiateEdit(row)}
                                      className="p-1.5 text-blue-600 hover:bg-blue-100 rounded-md transition"
                                      title="Edit Details"
                                    >
                                      <Edit className="h-4 w-4" />
                                    </button>
                                  </td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                        
                        <div className="flex items-center justify-between px-6 py-4 border-t border-slate-200 bg-slate-50">
                          <span className="text-sm text-slate-500">
                            Showing <span className="font-medium">{(currentPage - 1) * rowsPerPage + 1}</span> to <span className="font-medium">{Math.min(currentPage * rowsPerPage, sortedData.length)}</span> of <span className="font-medium">{sortedData.length}</span> results
                          </span>
                          <div className="flex gap-2">
                            <button 
                              onClick={() => setCurrentPage(p => Math.max(1, p - 1))}
                              disabled={currentPage === 1}
                              className="p-2 rounded-lg hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed text-slate-600"
                            >
                              <ChevronLeft className="h-5 w-5" />
                            </button>
                            <button 
                              onClick={() => setCurrentPage(p => Math.min(pageCount, p + 1))}
                              disabled={currentPage === pageCount}
                              className="p-2 rounded-lg hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed text-slate-600"
                            >
                              <ChevronRight className="h-5 w-5" />
                            </button>
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="flex flex-col items-center justify-center py-24 text-slate-400">
                        <FileSpreadsheet className="h-16 w-16 mb-4 opacity-50" />
                        <p className="text-lg font-medium text-slate-600">No data available</p>
                        <p className="text-sm">Upload an Excel file to get started</p>
                      </div>
                    )}
                  </div>
                )}
              </main>

              {isEditing && (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                    <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                      <h2 className="text-lg font-bold text-slate-800">
                        {currentId ? 'Edit Project Record' : 'Create New Project'}
                      </h2>
                      <button onClick={closeForm} className="text-slate-400 hover:text-slate-600">
                        <X className="h-6 w-6" />
                      </button>
                    </div>

                    <div className="flex border-b border-slate-200 px-6 pt-2 bg-white sticky top-0 overflow-x-auto custom-scrollbar">
                      {Object.keys(dynamicFieldGroups).map(group => (
                        <button
                          key={group}
                          onClick={() => setActiveTab(group)}
                          className={`px-4 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${
                            activeTab === group 
                              ? 'border-blue-600 text-blue-600' 
                              : 'border-transparent text-slate-500 hover:text-slate-700'
                          }`}
                        >
                          {group}
                        </button>
                      ))}
                    </div>

                    <div className="p-6 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50">
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {dynamicFieldGroups[activeTab]?.map(col => {
                          const type = getColumnType(col);
                          return (
                            <div key={col} className="flex flex-col gap-1">
                              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider truncate" title={col}>{col}</label>
                              {col === 'Status' ? (
                                <select
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm bg-white"
                                >
                                  <option value="">Select Status</option>
                                  {STATUS_OPTIONS.map(opt => (
                                    <option key={opt} value={opt}>{opt}</option>
                                  ))}
                                </select>
                              ) : col === 'Remarks' ? (
                                <textarea
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  rows={3}
                                  placeholder="Enter project updates and remarks..."
                                  className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm bg-white resize-none"
                                />
                              ) : type === 'date' ? (
                                <input
                                  type="date"
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm"
                                />
                              ) : (
                                <input
                                  type={type === 'number' ? "number" : "text"}
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  readOnly={col === 'Payment Balance' || col === 'Aging'}
                                  className={`px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm ${
                                    (col === 'Payment Balance' || col === 'Aging') ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white'
                                  }`}
                                />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="p-6 border-t border-slate-200 bg-white flex justify-end gap-3">
                      <button onClick={closeForm} className="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition text-sm">Cancel</button>
                      <button onClick={handleSave} className="px-5 py-2.5 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg shadow-lg shadow-blue-600/20 transition text-sm flex items-center">
                        <CheckCircle className="mr-2 h-4 w-4" />
                        Save Changes
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(ExcelTrackerManager));
    </script>
</body>
</html>
