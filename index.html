<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTracker 360</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- SheetJS Library for Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    
    <style>
        /* Custom Scrollbar Styles */
        .custom-scrollbar::-webkit-scrollbar {
            height: 8px;
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        
        /* Date input placeholder fix for iOS */
        input[type="date"] {
            min-height: 2.5rem;
        }
        
        /* Sync indicator animation */
        @keyframes pulse-sync {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .syncing {
            animation: pulse-sync 1.5s ease-in-out infinite;
        }
        
        /* Column resize handle */
        .resize-handle {
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
            width: 8px;
            cursor: col-resize;
            user-select: none;
            touch-action: none;
            z-index: 1;
        }
        
        .resize-handle:hover,
        .resize-handle.resizing {
            background: rgba(59, 130, 246, 0.5);
        }
        
        .resize-handle::after {
            content: '';
            position: absolute;
            right: 3px;
            top: 50%;
            transform: translateY(-50%);
            width: 2px;
            height: 20px;
            background: rgba(148, 163, 184, 0.4);
            border-radius: 1px;
        }
        
        .resizing-cursor * {
            cursor: col-resize !important;
        }
        
        /* Freeze Panes - Ensure sticky columns stack properly */
        thead th.sticky,
        tbody td.sticky {
            position: sticky;
            z-index: 5;
        }
        
        /* Header row should be above sticky columns */
        thead {
            position: sticky;
            top: 0;
            z-index: 20;
        }
        
        /* Make sure sticky header cells are above sticky body cells */
        thead th.sticky {
            z-index: 25;
        }
        
        /* Actions column (right side) should be on top */
        th.sticky.right-0,
        td.sticky.right-0 {
            z-index: 15;
        }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <!-- Application Code -->
    <script type="text/babel" data-type="module">
        import React, { useState, useMemo, useEffect } from 'https://esm.sh/react@18.2.0';
        import { createRoot } from 'https://esm.sh/react-dom@18.2.0/client';
        import { 
          Upload, Plus, Edit, X, Search, Download, 
          LayoutDashboard, DollarSign, Calendar, FileSpreadsheet, 
          ChevronLeft, ChevronRight, Layers, CheckCircle,
          ArrowUpDown, ArrowUp, ArrowDown, Wallet, ClipboardList,
          Wifi, WifiOff, Cloud, CloudOff, Filter, Trash2
        } from 'https://esm.sh/lucide-react@0.263.1';

        // --- Configuration & Types ---

        const COLUMN_DEFS = {
          'Sr No': 'general',
          'Client': 'general',
          'Location': 'general',
          'Callout': 'date',
          'Status': 'general',
          'State': 'general',
          'Address': 'general',
          'Contact Person': 'general',
          'Contact No.': 'general',
          'Sign Type': 'general',
          'Survey By': 'general',
          'Survey Date': 'date',
          'Survey Shared': 'general', 
          'Signage Size': 'general',
          'Artwork Sent': 'date',
          'Artwork Approval': 'date',
          'Cost Shared': 'date',
          'Cost Approval': 'date',
          'PI No.': 'general',
          'PI Date': 'date',
          'PO Received': 'date',
          'PO Number': 'general',
          'JC No': 'general',
          'JC Date': 'date',
          'Production Start': 'date',
          'Production Finish': 'date',
          'Dispatch Date': 'date',
          'At Site': 'date',
          'Work Start': 'date',
          'Work Complete': 'date',
          'Contractor': 'general',
          'Completion Certificate': 'general',
          'Photo': 'general',
          'Warranty': 'general',
          'Invoice No': 'general',
          'Invoice Date': 'date',
          'Invoice Amt': 'number',
          'Invoice Submitted': 'date',
          'Payment Terms': 'general',
          'Due Date': 'date',
          'Payment received': 'number',
          'Payment Balance': 'number',
          'AWB NO': 'general',
          'Aging': 'number',
          'Remarks': 'general'
        };

        // CORRECTED FIELD GROUPS - Per user's exact specification
        const FIELD_GROUPS_TEMPLATE = {
          'Client Info': ['Sr No', 'Client', 'Location', 'Callout', 'Status', 'State', 'Address', 'Contact Person', 'Contact No.'],
          'Survey & Details': ['Sign Type', 'Survey By', 'Survey Date', 'Survey Shared', 'Signage Size', 'Artwork Sent', 'Artwork Approval'],
          'Approval & PO': ['Cost Shared', 'Cost Approval', 'PI No.', 'PI Date', 'PO Received', 'PO Number'],
          'Production & Site': ['JC No', 'JC Date', 'Production Start', 'Production Finish', 'Dispatch Date', 'At Site', 'Work Start', 'Work Complete', 'Contractor', 'Completion Certificate', 'Photo', 'Warranty'],
          'Finance': ['Invoice No', 'Invoice Date', 'Invoice Amt', 'Invoice Submitted', 'Payment Terms', 'Due Date', 'Payment received', 'Payment Balance', 'AWB NO', 'Aging', 'Remarks']
        };

        const KNOWN_COLUMNS = Object.keys(COLUMN_DEFS);

        const STATUS_OPTIONS = [
          "Payment Awaited",
          "Invoice to be done",
          "WIP",
          "Material at Site",
          "Material at Site-Hold",
          "In Transit",
          "Under Production",
          "PO Awaited",
          "Cost Approval awaited",
          "Artwork Approval Awaited",
          "Survey to be done",
          "Photo Awaited",
          "Paid"
        ];

        const CLIENT_OPTIONS = [
          "Aditya Birla Fashion and Retail and Retail Limited (Pantaloons | OWND)",
          "Aditya Birla Fashion and Retail and Retail Limited (Madura Fashion )",
          "Blackberrys",
          "Heritage Foods",
          "Milky Mist",
          "Third Wave Coffee"
        ];

        // --- Helper Functions ---

        const toTitleCase = (str) => {
          if (!str || typeof str !== 'string') return str;
          if (STATUS_OPTIONS.includes(str)) return str;
          return str.toLowerCase().replace(/\b\w/g, s => s.toUpperCase());
        };

        const getColumnType = (colName) => {
          if (!colName) return 'general';
          const cleanName = colName.trim();
          if (COLUMN_DEFS[cleanName]) return COLUMN_DEFS[cleanName];
          const match = Object.keys(COLUMN_DEFS).find(k => k.toLowerCase() === cleanName.toLowerCase());
          return match ? COLUMN_DEFS[match] : 'general';
        };

        const parseExcelDate = (value) => {
          if (!value) return '';
          if (typeof value === 'number' && value > 20000) {
            const date = new Date(Math.round((value - 25569) * 86400 * 1000));
            return date.toISOString().split('T')[0];
          }
          if (typeof value === 'string') {
            if (value.includes('/')) {
              const parts = value.split('/');
              if (parts.length === 3) {
                let year = parts[2];
                if (year.length === 2) year = '20' + year;
                return `${year}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
              }
            }
            const date = new Date(value);
            if (!isNaN(date.getTime())) return date.toISOString().split('T')[0];
          }
          return value;
        };

        const formatDisplayDate = (isoString) => {
          if (!isoString) return '-';
          try {
            const date = new Date(isoString);
            return date.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          } catch {
            return isoString;
          }
        };

        const formatNumber = (value) => {
          if (value === null || value === undefined || value === '') return '-';
          return new Intl.NumberFormat('en-IN').format(value);
        };

        const parseCSV = (text) => {
          const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
          if (lines.length === 0) return { headers: [], rows: [] };
          const headers = lines[0].split(',').map(h => h.trim());
          const rows = lines.slice(1).map(line => {
            const values = line.split(',');
            const obj = {};
            headers.forEach((h, i) => {
              obj[h] = values[i]?.trim() || '';
            });
            return obj;
          });
          return { headers, rows };
        };

        const readExcelFile = (file) => {
          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
              try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { defval: '', raw: false });
                
                if (jsonData.length === 0) {
                  reject(new Error('Excel file is empty'));
                  return;
                }

                const headers = Object.keys(jsonData[0]);
                const rows = jsonData.map(row => {
                  const cleanRow = {};
                  headers.forEach(h => {
                    const type = getColumnType(h);
                    if (type === 'date') {
                      cleanRow[h] = parseExcelDate(row[h]);
                    } else if (type === 'number') {
                      cleanRow[h] = row[h] ? parseFloat(row[h]) : 0;
                    } else {
                      cleanRow[h] = toTitleCase(row[h]);
                    }
                  });
                  return cleanRow;
                });

                resolve({ headers, rows });
              } catch (err) {
                reject(err);
              }
            };
            reader.onerror = () => reject(new Error('File reading failed'));
            reader.readAsArrayBuffer(file);
          });
        };

        const exportToExcel = (data, filename = 'export.xlsx') => {
          const ws = XLSX.utils.json_to_sheet(data);
          const wb = XLSX.utils.book_new();
          XLSX.utils.book_append_sheet(wb, ws, 'Data');
          XLSX.writeFile(wb, filename);
        };

        // --- Local Storage Manager ---
        const STORAGE_KEY = 'protracker360_data';
        const LAST_SYNC_KEY = 'protracker360_last_sync';

        const saveToLocalStorage = (data) => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            localStorage.setItem(LAST_SYNC_KEY, new Date().toISOString());
            return true;
          } catch (error) {
            console.error('Failed to save to localStorage:', error);
            return false;
          }
        };

        const loadFromLocalStorage = () => {
          try {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : null;
          } catch (error) {
            console.error('Failed to load from localStorage:', error);
            return null;
          }
        };

        const getLastSyncTime = () => {
          try {
            const lastSync = localStorage.getItem(LAST_SYNC_KEY);
            return lastSync ? new Date(lastSync) : null;
          } catch (error) {
            return null;
          }
        };

        // --- Components ---

        const getStatusColor = (status) => {
          const colors = {
            'Paid': { bg: 'bg-green-100', text: 'text-green-700', border: 'border-green-300' },
            'Payment Awaited': { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-300' },
            'Invoice to be done': { bg: 'bg-orange-100', text: 'text-orange-700', border: 'border-orange-300' },
            'WIP': { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-300' },
            'Material at Site': { bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-300' },
            'Material at Site-Hold': { bg: 'bg-red-100', text: 'text-red-700', border: 'border-red-300' },
            'In Transit': { bg: 'bg-cyan-100', text: 'text-cyan-700', border: 'border-cyan-300' },
            'Under Production': { bg: 'bg-indigo-100', text: 'text-indigo-700', border: 'border-indigo-300' },
            'PO Awaited': { bg: 'bg-pink-100', text: 'text-pink-700', border: 'border-pink-300' },
            'Cost Approval awaited': { bg: 'bg-yellow-100', text: 'text-yellow-700', border: 'border-yellow-300' },
            'Artwork Approval Awaited': { bg: 'bg-lime-100', text: 'text-lime-700', border: 'border-lime-300' },
            'Survey to be done': { bg: 'bg-teal-100', text: 'text-teal-700', border: 'border-teal-300' },
            'Photo Awaited': { bg: 'bg-rose-100', text: 'text-rose-700', border: 'border-rose-300' }
          };
          return colors[status] || { bg: 'bg-slate-100', text: 'text-slate-700', border: 'border-slate-300' };
        };

        const StatusBadge = ({ status }) => {
          const colors = {
            'Paid': 'bg-green-100 text-green-700 border-green-200',
            'Payment Awaited': 'bg-amber-100 text-amber-700 border-amber-200',
            'Invoice to be done': 'bg-orange-100 text-orange-700 border-orange-200',
            'WIP': 'bg-blue-100 text-blue-700 border-blue-200',
            'Material at Site': 'bg-purple-100 text-purple-700 border-purple-200',
            'Material at Site-Hold': 'bg-red-100 text-red-700 border-red-200',
            'In Transit': 'bg-cyan-100 text-cyan-700 border-cyan-200',
            'Under Production': 'bg-indigo-100 text-indigo-700 border-indigo-200',
            'PO Awaited': 'bg-pink-100 text-pink-700 border-pink-200',
            'Cost Approval awaited': 'bg-yellow-100 text-yellow-700 border-yellow-200',
            'Artwork Approval Awaited': 'bg-lime-100 text-lime-700 border-lime-200',
            'Survey to be done': 'bg-teal-100 text-teal-700 border-teal-200',
            'Photo Awaited': 'bg-rose-100 text-rose-700 border-rose-200'
          };
          return (
            <span className={`px-2.5 py-1 rounded-full text-xs font-medium border ${colors[status] || 'bg-slate-100 text-slate-700 border-slate-200'}`}>
              {status || '-'}
            </span>
          );
        };

        function ExcelTrackerManager() {
          const [rawData, setRawData] = useState([]);
          const [activeView, setActiveView] = useState('dashboard');
          const [searchTerm, setSearchTerm] = useState('');
          const [isEditing, setIsEditing] = useState(false);
          const [formData, setFormData] = useState({});
          const [currentId, setCurrentId] = useState(null);
          const [activeTab, setActiveTab] = useState('Client Info');
          const [currentPage, setCurrentPage] = useState(1);
          const [sortConfig, setSortConfig] = useState({ key: null, direction: null });
          const [isOnline, setIsOnline] = useState(navigator.onLine);
          const [isSyncing, setIsSyncing] = useState(false);
          const [lastSyncTime, setLastSyncTime] = useState(null);
          const [selectedClient, setSelectedClient] = useState('');
          const [selectedStatus, setSelectedStatus] = useState('');
          const [showStatusModal, setShowStatusModal] = useState(false);
          const [statusModalData, setStatusModalData] = useState(null);
          const [columnWidths, setColumnWidths] = useState({});
          const [resizingColumn, setResizingColumn] = useState(null);
          const [showDeleteConfirm, setShowDeleteConfirm] = useState(false);
          const [deleteTargetId, setDeleteTargetId] = useState(null);
          const [selectedRowId, setSelectedRowId] = useState(null);

          const rowsPerPage = 25;

          // Online/Offline detection
          useEffect(() => {
            const handleOnline = () => {
              setIsOnline(true);
              console.log('Connection restored - online mode');
            };
            const handleOffline = () => {
              setIsOnline(false);
              console.log('Connection lost - offline mode');
            };

            window.addEventListener('online', handleOnline);
            window.addEventListener('offline', handleOffline);

            return () => {
              window.removeEventListener('online', handleOnline);
              window.removeEventListener('offline', handleOffline);
            };
          }, []);

          // Load data from localStorage on mount
          useEffect(() => {
            const storedData = loadFromLocalStorage();
            if (storedData && storedData.length > 0) {
              setRawData(storedData);
              setLastSyncTime(getLastSyncTime());
              console.log('Loaded data from localStorage:', storedData.length, 'records');
            }
          }, []);

          // Auto-save to localStorage whenever data changes
          useEffect(() => {
            if (rawData.length > 0) {
              const saved = saveToLocalStorage(rawData);
              if (saved) {
                setLastSyncTime(getLastSyncTime());
                console.log('Auto-saved to localStorage');
              }
            }
          }, [rawData]);

          const availableColumns = useMemo(() => {
            if (rawData.length === 0) return KNOWN_COLUMNS;
            const cols = new Set();
            rawData.forEach(row => Object.keys(row).forEach(k => cols.add(k)));
            return [...cols].filter(c => c !== '_id');
          }, [rawData]);

          const dynamicFieldGroups = useMemo(() => {
            const groups = {};
            Object.entries(FIELD_GROUPS_TEMPLATE).forEach(([groupName, fields]) => {
              groups[groupName] = fields.filter(f => availableColumns.includes(f));
            });
            // Orphans logic removed - all fields should be in FIELD_GROUPS_TEMPLATE
            // If a field is not in the template, it simply won't appear in any tab
            return groups;
          }, [availableColumns]);

          const tableColumns = useMemo(() => {
            // Return columns in the exact order they appear in COLUMN_DEFS
            return KNOWN_COLUMNS.filter(col => availableColumns.includes(col));
          }, [availableColumns]);

          // Initialize default column widths
          useEffect(() => {
            if (tableColumns.length > 0 && Object.keys(columnWidths).length === 0) {
              const defaultWidths = {};
              tableColumns.forEach(col => {
                // Set wider default widths for better visibility
                if (col === 'Client' || col === 'Location' || col === 'Address') {
                  defaultWidths[col] = 200;
                } else if (col === 'Status' || col === 'Contact Person') {
                  defaultWidths[col] = 180;
                } else if (col.includes('Date') || col === 'Callout') {
                  defaultWidths[col] = 130;
                } else if (col.includes('No') || col === 'State' || col === 'Sign Type') {
                  defaultWidths[col] = 120;
                } else {
                  defaultWidths[col] = 150;
                }
              });
              setColumnWidths(defaultWidths);
            }
          }, [tableColumns]);

          const getColumnWidth = (column) => {
            if (columnWidths[column]) return columnWidths[column];
            // Fallback defaults
            if (column === 'Client' || column === 'Location' || column === 'Address') return 200;
            if (column === 'Status' || column === 'Contact Person') return 180;
            if (column.includes('Date') || column === 'Callout') return 130;
            if (column.includes('No') || column === 'State' || column === 'Sign Type') return 120;
            return 150;
          };

          // Get unique client list for filter
          const clientList = useMemo(() => {
            const clients = new Set();
            rawData.forEach(row => {
              if (row['Client']) clients.add(row['Client']);
            });
            return ['All Clients', ...Array.from(clients).sort()];
          }, [rawData]);

          const filteredData = useMemo(() => {
            let filtered = rawData;
            
            // Filter by client
            if (selectedClient && selectedClient !== 'All Clients') {
              filtered = filtered.filter(row => row['Client'] === selectedClient);
            }
            
            // Filter by status
            if (selectedStatus && selectedStatus !== 'All Status') {
              filtered = filtered.filter(row => row['Status'] === selectedStatus);
            }
            
            // Filter by search term
            if (searchTerm.trim()) {
              const lower = searchTerm.toLowerCase();
              filtered = filtered.filter(row =>
                Object.values(row).some(val =>
                  String(val).toLowerCase().includes(lower)
                )
              );
            }
            
            return filtered;
          }, [rawData, searchTerm, selectedClient, selectedStatus]);

          const sortedData = useMemo(() => {
            if (!sortConfig.key) return filteredData;
            
            const sorted = [...filteredData].sort((a, b) => {
              const aVal = a[sortConfig.key];
              const bVal = b[sortConfig.key];
              
              if (aVal === bVal) return 0;
              if (!aVal) return 1;
              if (!bVal) return -1;
              
              const type = getColumnType(sortConfig.key);
              if (type === 'number') {
                return parseFloat(aVal) - parseFloat(bVal);
              }
              if (type === 'date') {
                return new Date(aVal) - new Date(bVal);
              }
              return String(aVal).localeCompare(String(bVal));
            });
            
            return sortConfig.direction === 'desc' ? sorted.reverse() : sorted;
          }, [filteredData, sortConfig]);

          const paginatedData = useMemo(() => {
            const start = (currentPage - 1) * rowsPerPage;
            return sortedData.slice(start, start + rowsPerPage);
          }, [sortedData, currentPage]);

          const pageCount = Math.ceil(sortedData.length / rowsPerPage);

          const dashboardMetrics = useMemo(() => {
            const totalProjects = filteredData.length;
            const totalInvoiceAmt = filteredData.reduce((sum, row) => sum + (parseFloat(row['Invoice Amt']) || 0), 0);
            const totalPaymentReceived = filteredData.reduce((sum, row) => sum + (parseFloat(row['Payment received']) || 0), 0);
            const totalBalance = filteredData.reduce((sum, row) => sum + (parseFloat(row['Payment Balance']) || 0), 0);
            
            const statusCounts = {};
            filteredData.forEach(row => {
              const status = row['Status'] || 'Unknown';
              statusCounts[status] = (statusCounts[status] || 0) + 1;
            });

            return {
              totalProjects,
              totalInvoiceAmt,
              totalPaymentReceived,
              totalBalance,
              statusCounts
            };
          }, [filteredData]);

          const handleSort = (column) => {
            setSortConfig(prev => {
              if (prev.key === column) {
                if (prev.direction === 'asc') return { key: column, direction: 'desc' };
                if (prev.direction === 'desc') return { key: null, direction: null };
              }
              return { key: column, direction: 'asc' };
            });
          };

          const handleStatusClick = (status) => {
            const projectsWithStatus = rawData.filter(row => row['Status'] === status);
            const totalInvoice = projectsWithStatus.reduce((sum, row) => sum + (parseFloat(row['Invoice Amt']) || 0), 0);
            const totalPayment = projectsWithStatus.reduce((sum, row) => sum + (parseFloat(row['Payment received']) || 0), 0);
            const totalBalance = projectsWithStatus.reduce((sum, row) => sum + (parseFloat(row['Payment Balance']) || 0), 0);
            
            setStatusModalData({
              status,
              projects: projectsWithStatus,
              count: projectsWithStatus.length,
              totalInvoice,
              totalPayment,
              totalBalance
            });
            setShowStatusModal(true);
          };

          const applyStatusFilter = (status) => {
            setSelectedStatus(status);
            setShowStatusModal(false);
            setActiveView('data');
            setCurrentPage(1);
          };

          const clearAllFilters = () => {
            setSelectedClient('');
            setSelectedStatus('');
            setSearchTerm('');
            setCurrentPage(1);
          };

          const handleDeleteEntry = (id) => {
            setDeleteTargetId(id);
            setShowDeleteConfirm(true);
          };

          const confirmDelete = () => {
            if (deleteTargetId) {
              setRawData(prev => prev.filter(item => item._id !== deleteTargetId));
              setShowDeleteConfirm(false);
              setDeleteTargetId(null);
            }
          };

          const cancelDelete = () => {
            setShowDeleteConfirm(false);
            setDeleteTargetId(null);
          };

          const handleClearAllData = () => {
            if (window.confirm('⚠️ Are you sure you want to delete ALL data? This cannot be undone!')) {
              setRawData([]);
              localStorage.removeItem(STORAGE_KEY);
              localStorage.removeItem(LAST_SYNC_KEY);
              setLastSyncTime(null);
              alert('✅ All data has been cleared!');
            }
          };

          const handleResizeStart = (e, column) => {
            e.preventDefault();
            setResizingColumn({ column, startX: e.pageX, startWidth: getColumnWidth(column) });
          };

          useEffect(() => {
            const handleResizeMove = (e) => {
              if (resizingColumn) {
                const diff = e.pageX - resizingColumn.startX;
                const newWidth = Math.max(80, resizingColumn.startWidth + diff); // Minimum 80px
                setColumnWidths(prev => ({
                  ...prev,
                  [resizingColumn.column]: newWidth
                }));
              }
            };

            const handleResizeEnd = () => {
              setResizingColumn(null);
              document.body.classList.remove('resizing-cursor');
            };

            if (resizingColumn) {
              document.body.classList.add('resizing-cursor');
              document.addEventListener('mousemove', handleResizeMove);
              document.addEventListener('mouseup', handleResizeEnd);

                              disabled={currentPage === pageCount}
                              className="p-2 rounded-lg hover:bg-slate-200 disabled:opacity-50 disabled:cursor-not-allowed text-slate-600"
                            >
                              <ChevronRight className="h-5 w-5" />
                            </button>
                          </div>
                        </div>
                      </>
                    ) : (
                      <div className="flex flex-col items-center justify-center py-24 text-slate-400">
                        <FileSpreadsheet className="h-16 w-16 mb-4 opacity-50" />
                        <p className="text-lg font-medium text-slate-600">No data available</p>
                        <p className="text-sm">Upload an Excel file to get started</p>
                      </div>
                    )}
                  </div>
                )}
              </main>

              {isEditing && (
                <div className="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden">
                    <div className="px-6 py-4 border-b border-slate-200 flex justify-between items-center bg-gradient-to-r from-blue-50 to-slate-50">
                      <div>
                        <h2 className="text-lg font-bold text-slate-800">
                          {currentId ? 'Edit Project Record' : 'Create New Project'}
                        </h2>
                        {currentId && formData['Client'] && (
                          <p className="text-sm text-slate-600 mt-1 flex items-center gap-2">
                            <span className="font-semibold text-blue-600">{formData['Client']}</span>
                            {formData['Location'] && (
                              <>
                                <span className="text-slate-400">•</span>
                                <span>{formData['Location']}</span>
                              </>
                            )}
                            {formData['Sr No'] && (
                              <>
                                <span className="text-slate-400">•</span>
                                <span className="text-slate-500">#{formData['Sr No']}</span>
                              </>
                            )}
                          </p>
                        )}
                      </div>
                      <button onClick={closeForm} className="text-slate-400 hover:text-slate-600">
                        <X className="h-6 w-6" />
                      </button>
                    </div>

                    <div className="flex border-b border-slate-200 px-6 pt-2 bg-white sticky top-0 overflow-x-auto custom-scrollbar">
                      {Object.keys(dynamicFieldGroups).map(group => (
                        <button
                          key={group}
                          onClick={() => setActiveTab(group)}
                          className={`px-4 py-3 text-sm font-medium border-b-2 transition-colors whitespace-nowrap ${
                            activeTab === group 
                              ? 'border-blue-600 text-blue-600' 
                              : 'border-transparent text-slate-500 hover:text-slate-700'
                          }`}
                        >
                          {group}
                        </button>
                      ))}
                    </div>

                    <div className="p-6 overflow-y-auto custom-scrollbar flex-1 bg-slate-50/50">
                      <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {dynamicFieldGroups[activeTab]?.map(col => {
                          const type = getColumnType(col);
                          const today = new Date().toISOString().split('T')[0];
                          return (
                            <div key={col} className="flex flex-col gap-1">
                              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider truncate" title={col}>{col}</label>
                              {col === 'Status' ? (
                                <select
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm bg-white"
                                >
                                  <option value="">Select Status</option>
                                  {STATUS_OPTIONS.map(opt => (
                                    <option key={opt} value={opt}>{opt}</option>
                                  ))}
                                </select>
                              ) : col === 'Client' ? (
                                <div className="relative">
                                  <input
                                    list="client-options"
                                    value={formData[col] || ''}
                                    onChange={e => handleInputChange(col, e.target.value)}
                                    placeholder="Select or type client name..."
                                    className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm bg-white w-full"
                                  />
                                  <datalist id="client-options">
                                    {CLIENT_OPTIONS.map(opt => (
                                      <option key={opt} value={opt} />
                                    ))}
                                  </datalist>
                                </div>
                              ) : col === 'Remarks' ? (
                                <textarea
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  rows={3}
                                  placeholder="Enter project updates and remarks..."
                                  className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm bg-white resize-none"
                                />
                              ) : type === 'date' ? (
                                <input
                                  type="date"
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  max={today}
                                  className="px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm"
                                  title="Date cannot be greater than today"
                                />
                              ) : (
                                <input
                                  type={type === 'number' ? "number" : "text"}
                                  value={formData[col] || ''}
                                  onChange={e => handleInputChange(col, e.target.value)}
                                  readOnly={col === 'Payment Balance' || col === 'Aging' || col === 'Sr No'}
                                  className={`px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500/50 focus:border-blue-500 text-sm ${
                                    (col === 'Payment Balance' || col === 'Aging' || col === 'Sr No') ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : 'bg-white'
                                  }`}
                                />
                              )}
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="p-6 border-t border-slate-200 bg-white flex justify-end gap-3">
                      <button onClick={closeForm} className="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition text-sm">Cancel</button>
                      <button onClick={handleSave} className="px-5 py-2.5 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg shadow-lg shadow-blue-600/20 transition text-sm flex items-center">
                        <CheckCircle className="mr-2 h-4 w-4" />
                        Save Changes
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showStatusModal && statusModalData && (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-5xl max-h-[90vh] flex flex-col overflow-hidden">
                    <div className="px-6 py-5 border-b border-slate-200 bg-gradient-to-r from-blue-50 to-slate-50">
                      <div className="flex justify-between items-start">
                        <div>
                          <h2 className="text-xl font-bold text-slate-800 mb-2">Status Details</h2>
                          <StatusBadge status={statusModalData.status} />
                        </div>
                        <button onClick={() => setShowStatusModal(false)} className="text-slate-400 hover:text-slate-600 transition">
                          <X className="h-6 w-6" />
                        </button>
                      </div>
                    </div>

                    <div className="p-6 space-y-6 overflow-y-auto custom-scrollbar flex-1 bg-slate-50">
                      <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                        <div className="bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl shadow-lg p-5 text-white">
                          <div className="flex items-center justify-between mb-3">
                            <Layers className="h-7 w-7 opacity-80" />
                          </div>
                          <p className="text-blue-100 text-xs font-medium mb-1">Total Projects</p>
                          <p className="text-3xl font-bold">{statusModalData.count}</p>
                        </div>

                        <div className="bg-gradient-to-br from-green-500 to-green-600 rounded-xl shadow-lg p-5 text-white">
                          <div className="flex items-center justify-between mb-3">
                            <DollarSign className="h-7 w-7 opacity-80" />
                          </div>
                          <p className="text-green-100 text-xs font-medium mb-1">Invoice Amount</p>
                          <p className="text-2xl font-bold">₹{formatNumber(statusModalData.totalInvoice)}</p>
                        </div>

                        <div className="bg-gradient-to-br from-purple-500 to-purple-600 rounded-xl shadow-lg p-5 text-white">
                          <div className="flex items-center justify-between mb-3">
                            <Wallet className="h-7 w-7 opacity-80" />
                          </div>
                          <p className="text-purple-100 text-xs font-medium mb-1">Payment Received</p>
                          <p className="text-2xl font-bold">₹{formatNumber(statusModalData.totalPayment)}</p>
                        </div>

                        <div className="bg-gradient-to-br from-amber-500 to-amber-600 rounded-xl shadow-lg p-5 text-white">
                          <div className="flex items-center justify-between mb-3">
                            <ClipboardList className="h-7 w-7 opacity-80" />
                          </div>
                          <p className="text-amber-100 text-xs font-medium mb-1">Balance Due</p>
                          <p className="text-2xl font-bold">₹{formatNumber(statusModalData.totalBalance)}</p>
                        </div>
                      </div>

                      <div className="bg-white rounded-xl shadow border border-slate-200">
                        <div className="px-5 py-4 border-b border-slate-200 bg-slate-50">
                          <h3 className="font-bold text-slate-800 flex items-center gap-2">
                            <FileSpreadsheet className="h-5 w-5 text-blue-600" />
                            Projects List
                          </h3>
                        </div>
                        <div className="overflow-x-auto custom-scrollbar max-h-96">
                          <table className="w-full">
                            <thead className="bg-slate-100 border-b border-slate-200 sticky top-0">
                              <tr>
                                <th className="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Client</th>
                                <th className="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Location</th>
                                <th className="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Invoice Amt</th>
                                <th className="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Payment</th>
                                <th className="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Balance</th>
                                <th className="px-4 py-3 text-left text-xs font-semibold text-slate-600 uppercase">Callout</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {statusModalData.projects.map((project, idx) => (
                                <tr key={idx} className="hover:bg-blue-50 transition-colors">
                                  <td className="px-4 py-3 text-sm text-slate-700 font-medium">{project['Client']}</td>
                                  <td className="px-4 py-3 text-sm text-slate-600">{project['Location']}</td>
                                  <td className="px-4 py-3 text-sm text-slate-600">₹{formatNumber(project['Invoice Amt'])}</td>
                                  <td className="px-4 py-3 text-sm text-slate-600">₹{formatNumber(project['Payment received'])}</td>
                                  <td className="px-4 py-3 text-sm font-semibold text-amber-600">₹{formatNumber(project['Payment Balance'])}</td>
                                  <td className="px-4 py-3 text-sm text-slate-600">{formatDisplayDate(project['Callout'])}</td>
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      </div>
                    </div>

                    <div className="p-6 border-t border-slate-200 bg-white flex justify-between gap-3">
                      <button 
                        onClick={() => setShowStatusModal(false)} 
                        className="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-100 rounded-lg transition text-sm"
                      >
                        Close
                      </button>
                      <button 
                        onClick={() => applyStatusFilter(statusModalData.status)} 
                        className="px-5 py-2.5 bg-blue-600 text-white font-medium hover:bg-blue-700 rounded-lg shadow-lg shadow-blue-600/20 transition text-sm flex items-center gap-2"
                      >
                        <Filter className="h-4 w-4" />
                        View All {statusModalData.status} Projects
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {showDeleteConfirm && (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
                    <div className="px-6 py-5 border-b border-slate-200 bg-gradient-to-r from-red-50 to-slate-50">
                      <div className="flex items-center gap-3">
                        <div className="w-12 h-12 bg-red-100 rounded-full flex items-center justify-center">
                          <Trash2 className="h-6 w-6 text-red-600" />
                        </div>
                        <div>
                          <h2 className="text-xl font-bold text-slate-800">Delete Entry</h2>
                          <p className="text-sm text-slate-600">This action cannot be undone</p>
                        </div>
                      </div>
                    </div>

                    <div className="p-6">
                      <p className="text-slate-700 mb-4">
                        Are you sure you want to delete this project entry? All data associated with this entry will be permanently removed.
                      </p>
                      <div className="bg-amber-50 border border-amber-200 rounded-lg p-4 flex items-start gap-3">
                        <div className="text-amber-600 mt-0.5">⚠️</div>
                        <p className="text-sm text-amber-800">
                          <strong>Warning:</strong> This will permanently delete the entry from your records and cannot be recovered.
                        </p>
                      </div>
                    </div>

                    <div className="p-6 border-t border-slate-200 bg-slate-50 flex justify-end gap-3">
                      <button 
                        onClick={cancelDelete} 
                        className="px-5 py-2.5 text-slate-600 font-medium hover:bg-slate-200 rounded-lg transition text-sm"
                      >
                        Cancel
                      </button>
                      <button 
                        onClick={confirmDelete} 
                        className="px-5 py-2.5 bg-red-600 text-white font-medium hover:bg-red-700 rounded-lg shadow-lg shadow-red-600/20 transition text-sm flex items-center gap-2"
                      >
                        <Trash2 className="h-4 w-4" />
                        Delete Entry
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(React.createElement(ExcelTrackerManager));
    </script>
</body>
</html>
